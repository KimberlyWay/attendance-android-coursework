name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w ru.student.attendance.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -q "OK (2 tests)" instrumentation.txt
            adb pull /sdcard/Android/data/ru.student.attendance/files/screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            screenshots
            instrumentation.txt
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
